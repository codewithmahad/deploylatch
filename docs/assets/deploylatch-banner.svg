    <rect x="920" y="164" width="170" height="172" rx="22" fill="#303540" stroke="#606A7D"/>
    <path d="M997 195H957V305H989M1020 195H1053V305H1015" stroke="#F5F6F8" stroke-width="12"/>
    <path d="M979 250H1034" stroke="#7298FF" stroke-width="15"/>
    <circle cx="1034" cy="250" r="13" fill="#7298FF"/>
    <circle cx="1034" cy="250" r="4" fill="#24272E"/>
    <path d="M1162 277V340C1162 366 1147 381 1121 381H885C862 381 850 368 850 346V305" stroke="#7298FF" stroke-width="2"/>
    <path d="M842 317L850 304L858 317" stroke="#7298FF" stroke-width="2"/>
