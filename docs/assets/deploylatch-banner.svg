<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DeployLatch</title>
  <desc id="desc">Linux deployments, with a rollback plan. A custom mechanical latch sits between a forward release path and a return path.</desc>
  <defs>
    <pattern id="ticks" width="24" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0V6" stroke="#626A7A" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="480" rx="16" fill="#24272E"/>
  <path d="M0 464H1280V480H0Z" fill="#7298FF"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="58" y="61" fill="#C4C9D4" font-size="13" font-weight="600" letter-spacing="3">OPERATING SYSTEMS / LINUX</text>
    <path d="M58 88H1222" stroke="#454B57"/>
    <text x="54" y="194" fill="#F5F6F8" font-size="86" font-weight="700" letter-spacing="-4">DeployLatch<tspan fill="#7298FF">.</tspan></text>
    <text x="59" y="259" fill="#F5F6F8" font-size="32" font-weight="400" letter-spacing="-.6">Linux deployments,</text>
    <text x="59" y="301" fill="#F5F6F8" font-size="32" font-weight="400" letter-spacing="-.6">with a rollback plan.</text>
    <path d="M58 367H665" stroke="#454B57"/>
    <text x="59" y="403" fill="#C4C9D4" font-size="14" font-weight="600" letter-spacing="2">BASH</text>
    <circle cx="126" cy="398" r="2" fill="#7298FF"/>
    <text x="149" y="403" fill="#C4C9D4" font-size="14" font-weight="600" letter-spacing="2">JAVA</text>
    <circle cx="215" cy="398" r="2" fill="#7298FF"/>
    <text x="238" y="403" fill="#C4C9D4" font-size="14" font-weight="600" letter-spacing="2">UBUNTU</text>
    <text x="665" y="403" fill="#C4C9D4" font-size="12" text-anchor="end" letter-spacing="1.5">A COURSE PROJECT</text>
  </g>
  <path d="M740 127V408" stroke="#454B57"/>
  <rect x="788" y="127" width="434" height="12" fill="url(#ticks)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M798 250H902" stroke="#C4C9D4" stroke-width="2"/>
    <path d="M889 243L902 250L889 257" stroke="#C4C9D4" stroke-width="2"/>
    <path d="M1100 250H1207" stroke="#C4C9D4" stroke-width="2"/>
